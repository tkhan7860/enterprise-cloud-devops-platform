apiVersion: apps/v1
kind: Deployment

metadata:
  name: enterprise-app
  namespace: enterprise-dev
  labels:
    app: enterprise-app
    environment: dev

spec:
  replicas: 2

  selector:
    matchLabels:
      app: enterprise-app

  template:
    metadata:
      labels:
        app: enterprise-app
        environment: dev

    spec:
      imagePullSecrets:
        - name: acr-secret

      containers:
        - name: enterprise-app
          image: acrenterpriseclouddev.azurecr.io/enterprise-app:1.1.0
          imagePullPolicy: Always

          ports:
            - containerPort: 8080
              protocol: TCP

          env:
            - name: ENVIRONMENT
              value: "development"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
