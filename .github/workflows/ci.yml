name: Enterprise App CI

on:
  push:
    branches:
      - main
      - feature/terraform-foundation

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: applications/enterprise-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python application
        run: |
          python -m py_compile app.py

      - name: Test Flask application
        run: |
          python - <<'PY'
          from app import app

          client = app.test_client()

          response = client.get("/")
          assert response.status_code == 200

          response = client.get("/health")
          assert response.status_code == 200

          response = client.get("/ready")
          assert response.status_code == 200

          response = client.get("/info")
          assert response.status_code == 200

          print("All application endpoints passed.")
          PY

      - name: Check application files
        run: |
          test -f app.py
          test -f requirements.txt
          test -f Dockerfile
          test -f scripts/health-check.sh

      - name: Check health script
        run: |
          test -x scripts/health-check.sh

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name acrenterpriseclouddev

      - name: Build Docker image
        working-directory: applications/enterprise-app
        run: |
          docker build \
            -t enterprise-app:${{ github.sha }} \
            .
      - name: Test Docker container
        run: |
          docker run -d \
            --name enterprise-app-test \
            -p 8080:8080 \
            enterprise-app:${{ github.sha }}

          sleep 5

          curl --fail http://localhost:8080/
          curl --fail http://localhost:8080/health
          curl --fail http://localhost:8080/ready
          curl --fail http://localhost:8080/info

          docker stop enterprise-app-test
          docker rm enterprise-app-test

      - name: Push Docker image to ACR
        run: |
          docker tag \
            enterprise-app:${{ github.sha }} \
            acrenterpriseclouddev.azurecr.io/enterprise-app:${{ github.sha }}

          docker push \
            acrenterpriseclouddev.azurecr.io/enterprise-app:${{ github.sha }}

  deploy-dev:
    name: Deploy to AKS Dev
    runs-on: ubuntu-latest
    needs: docker-build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context
        run: |
          az aks get-credentials \
            --resource-group rg-enterprise-devops-dev \
            --name aks-enterprise-dev \
            --overwrite-existing

      - name: Verify AKS access
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy application
        run: |
          kubectl set image deployment/enterprise-app \
            enterprise-app=acrenterpriseclouddev.azurecr.io/enterprise-app:${{ github.sha }} \
            --namespace enterprise-dev

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/enterprise-app \
            --namespace enterprise-dev \
            --timeout=180s

      - name: Verify deployment
        run: |
          kubectl get deployment enterprise-app \
            --namespace enterprise-dev

          kubectl get pods \
            --namespace enterprise-dev
